version: '3.8'

services:
  caddy:
    image: caddy:2.7-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bharatdoc
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    ports:
      - "5173:5173"

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/bharatdoc
      - SECRET_KEY=supersecretkey12345
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://localhost,http://localhost:5173,http://127.0.0.1:5173
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - USE_LLM=true
      - OLLAMA_MODEL=llama3.2:1b
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  worker:
    build:
      context: ./backend
    command: celery -A worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/bharatdoc
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  ollama_data:
