name: Deploy to Production

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*.*.*'     # Trigger on version tags (e.g., v1.0.0)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            # Exit immediately if a command exits with a non-zero status
            set -e
            
            # Navigate to project directory (update this path based on your server)
            cd /opt/bharatdoc || cd ~/BharatDoc
            
            # Pull latest changes
            echo "Pulling latest changes..."
            git pull origin main
            
            # Rebuild and start containers in detached mode
            echo "Building and starting containers..."
            docker compose -f docker-compose.prod.yml up -d --build
            
            # Wait for services to initialize
            echo "Waiting for services to start (15s)..."
            sleep 15
            
            # Post-deploy health check (using the domain or localhost)
            echo "Running health check..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
            
            if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "Health check failed with status $HTTP_STATUS!"
              echo "Fetching backend logs:"
              docker compose -f docker-compose.prod.yml logs --tail=50 backend
              
              echo "--- ROLLBACK INITIATED ---"
              # Rollback to the previous commit
              git checkout HEAD@{1}
              docker compose -f docker-compose.prod.yml up -d --build
              
              exit 1
            else
              echo "Health check passed ($HTTP_STATUS)."
              echo "Deployment successful!"
            fi
